# fly.toml app configuration file generated for jpa-quote-builder on 2026-11-01T18:17:54+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jpa-quote-builder'
primary_region = 'sin'

[build]

[env]
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  NODE_ENV = "production"
  JPA_DATA_DIR = "/var/data"

[mounts]
  source = "jpa_data"
  destination = "/var/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
